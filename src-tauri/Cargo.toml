[package]
name = "deepgit"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "DeepGit - a desktop Git client built with Tauri 2"

[lib]
name = "deepgit_lib"
# Desktop only: staticlib/cdylib are for Tauri mobile.
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "=2.5.5"
tauri-plugin-window-state = "=2.5.0"
tauri-plugin-opener = "=2.7.2"
gitcore = { path = "../crates/gitcore" }
notify = "6"
notify-debouncer-mini = "0.4"
sha1_smol = "1"
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { version = "=0.3.23", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"
