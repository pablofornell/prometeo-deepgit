<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <link rel="icon" href="data:," />
    <title>DeepGit</title>
    <!-- Apply the theme before the stylesheet loads so there is no white flash (same logic as applyTheme() in src/state/settings.ts). -->
    <script>
      (function () {
        try {
          var p = JSON.parse(localStorage.getItem("deepgit.ui.theme") || '"dark"');
          var dark = p === "dark" || (p !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
        } catch (e) {}
      })();
    </script>
    <style>
      html[data-theme="dark"] { background: #191a1c; }
      html[data-theme="light"] { background: #e9eaee; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script src="/src/index.tsx" type="module"></script>
  </body>
</html>
