<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <link rel="icon" href="data:," />
    <title>DeepGit</title>
    <!-- Apply the theme and the sizes before the stylesheet loads so there is no white flash or jump (same logic as applyTheme() / applyAppearance() in src/state/settings.ts). -->
    <script>
      (function () {
        try {
          var p = JSON.parse(localStorage.getItem("deepgit.ui.theme") || '"dark"');
          var dark = p === "dark" || (p !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
        } catch (e) {}
        // Same for the sizes (appearanceVars() in src/state/appearance.ts; src/state/prepaint.test.ts keeps the two in sync).
        try {
          var read = function (k) {
            try { var r = localStorage.getItem("deepgit.ui." + k); return r === null ? null : JSON.parse(r); } catch (e) { return null; }
          };
          var int = function (v, min, max, d) {
            return typeof v === "number" && isFinite(v) ? Math.min(max, Math.max(min, Math.round(v))) : d;
          };
          var font = int(read("fontSize"), 10, 20, 13);
          var editor = read("editorFontSize");
          editor = typeof editor === "number" && isFinite(editor) ? int(editor, 10, 20, 12) : int(Math.round((font * 12) / 13), 10, 20, 12);
          var zoom = read("uiScale");
          zoom = typeof zoom === "number" && isFinite(zoom) ? Math.min(200, Math.max(80, Math.round(zoom / 10) * 10)) : 100;
          var st = document.documentElement.style;
          st.setProperty("--dg-font-base", font + "px");
          st.setProperty("--dg-text-scale", String(Math.round((font / 13) * 10000) / 10000));
          st.setProperty("--dg-editor-font-base", editor + "px");
          st.setProperty("--dg-ui-scale", String(zoom / 100));
          // In the desktop app the webview zoom does this; in a browser it is the CSS zoom of <html>.
          if (zoom !== 100 && !("__TAURI_INTERNALS__" in window)) st.setProperty("zoom", String(zoom / 100));
        } catch (e) {}
      })();
    </script>
    <style>
      html[data-theme="dark"] { background: #191a1c; }
      html[data-theme="light"] { background: #e9eaee; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script src="/src/index.tsx" type="module"></script>
  </body>
</html>
