# Release: builds the installers on GitHub's runners and publishes them as a GitHub Release.
# Start it by pushing a version tag (`git tag v0.1.0 && git push origin v0.1.0`) or by hand
# from the Actions tab ("Run workflow", give the tag).
#
# Assets per platform (Tauri bundler):
#   Windows: DeepGit_<ver>_x64-setup.exe (NSIS installer) and DeepGit_<ver>_x64_en-US.msi
#   Linux:   .AppImage, .deb, .rpm (built on Ubuntu 22.04 for an older glibc)
#   macOS:   .dmg for Apple silicon and for Intel
# The installers are not code-signed: Windows SmartScreen and macOS Gatekeeper warn at the first start.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (for example v0.1.0); created on the current commit if missing"
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            args: ""
          - name: linux-x64
            os: ubuntu-22.04
            args: ""
          - name: macos-arm64
            os: macos-latest
            args: "--target aarch64-apple-darwin"
          - name: macos-x64
            os: macos-latest
            args: "--target x86_64-apple-darwin"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux system packages (WebKitGTK for Tauri)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.name }}

      - name: npm ci
        run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: src-tauri
          tagName: ${{ github.event.inputs.tag || github.ref_name }}
          releaseName: "DeepGit ${{ github.event.inputs.tag || github.ref_name }}"
          releaseBody: |
            Download the file for your system:
            - **Windows:** `DeepGit_*_x64-setup.exe` (installer) or the `.msi`.
            - **Linux:** `.AppImage` (any distro: make it executable and run it), `.deb` or `.rpm`. Needs WebKitGTK 4.1.
            - **macOS:** `.dmg` (`aarch64` = Apple silicon, `x64` = Intel).

            DeepGit uses the `git` command, so Git must be installed and on PATH.
            The installers are not code-signed. Windows: "More info", then "Run anyway".
            macOS: right-click the app, then "Open".
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
