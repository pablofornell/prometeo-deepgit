<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <rect x="0" y="0" width="1024" height="1024" rx="224" ry="224" fill="#191A1C"/>
  <g fill="none" stroke-width="96" stroke-linecap="round" stroke-linejoin="round">
    <!-- trunk: accent lane from the bottom commit up to the crown -->
    <path d="M512 820 V204" stroke="#4A86FF"/>
    <!-- left bough: green lane from the fork -->
    <path d="M512 512 C430 512 232 460 232 340" stroke="#2FE08A"/>
    <!-- right bough: amber lane from the fork -->
    <path d="M512 512 C594 512 792 460 792 340" stroke="#FFB52E"/>
  </g>
  <!-- commit nodes: outlined in the tile colour so the lanes stay separate -->
  <g stroke="#191A1C" stroke-width="24">
    <circle cx="512" cy="820" r="96" fill="#4A86FF"/>
    <circle cx="512" cy="512" r="96" fill="#4A86FF"/>
    <circle cx="512" cy="204" r="96" fill="#4A86FF"/>
    <circle cx="232" cy="340" r="96" fill="#2FE08A"/>
    <circle cx="792" cy="340" r="96" fill="#FFB52E"/>
  </g>
</svg>
