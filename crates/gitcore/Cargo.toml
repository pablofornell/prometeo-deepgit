[package]
name = "gitcore"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "DeepGit Git core: runs the git CLI and parses its output (no Tauri dependency)"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
sha1_smol = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
